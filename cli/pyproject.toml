[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos"
version = "0.1.0"
description = "AI-powered CLI for simplifying compiler and runtime errors."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Tanvi Pokale" }
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1"
]

[project.scripts]
lumos = "lumos.cli:app"

[tool.setuptools.packages.find]
include = ["lumos*"]